<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>rX YouTube Download API</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #0c1220;
        color: #eef4ff;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        background:
          radial-gradient(circle at 15% 10%, #1b3b69 0, transparent 42%),
          radial-gradient(circle at 90% 90%, #3a204e 0, transparent 38%),
          #0c1220;
      }

      main {
        width: min(680px, calc(100% - 40px));
        padding: 42px;
        border: 1px solid #2d4265;
        border-radius: 24px;
        background: rgba(15, 27, 48, 0.86);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.28);
      }

      .author {
        margin: 0 0 18px;
        color: #76b6ff;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(32px, 6vw, 58px);
        letter-spacing: -0.04em;
      }

      p {
        color: #b9c7dc;
        font-size: 17px;
        line-height: 1.65;
      }

      code {
        display: block;
        overflow-x: auto;
        margin-top: 24px;
        padding: 18px;
        border-radius: 14px;
        background: #080d17;
        color: #a9d1ff;
        font-size: 14px;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="author">Author: rX</p>
      <h1>YouTube Download API</h1>
      <p>
        Generate an MP3 download URL from a public YouTube video through the
        API endpoint below.
      </p>
      <code>GET /api/dl?link=https://www.youtube.com/watch?v=VIDEO_ID</code>
    </main>
  </body>
</html>
