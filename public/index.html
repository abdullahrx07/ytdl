<!DOCTYPE html>
<html>
<head>
<title>hello there, 👋🏻</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:#0a0a0a;
    color:#0f0;
    font-family:'Courier New',monospace;
    text-align:center;
    padding:60px 20px;
    font-weight:900;
    position:relative;
    overflow-x:hidden;
    min-height:100vh;
  }
  #stars{
    position:fixed;
    top:0;left:0;
    width:100%;height:100%;
    z-index:0;
    display:block;
  }
  .content{
    position:relative;
    z-index:1;
  }
  img{
    width:180px;height:180px;
    border-radius:50%;
    margin-bottom:30px;
    border:4px solid #0f0;
    box-shadow:0 0 20px rgba(0,255,0,0.4);
  }
  h1{font-size:3rem;margin-bottom:10px;font-weight:900;text-shadow:0 0 10px rgba(0,255,0,0.5);}
  p{font-size:1.3rem;margin:8px 0;font-weight:900;}
  #contact{
    text-align:left;
    margin-top:40px;
    margin-bottom:80px;
    margin-left:20px;
    opacity:0;
    transform:translateY(40px);
    transition:opacity 0.8s ease, transform 0.8s ease;
  }
  #contact.visible{
    opacity:1;
    transform:translateY(0);
  }
  #contact h2{
    font-size:0.9rem;
    margin:0 0 8px 0;
    text-shadow:0 0 8px rgba(0,255,0,0.4);
  }
  #waBtn{
    padding:8px 16px;
    font-size:0.85rem;
    background:#25D366;
    color:#000;
    border:none;
    cursor:pointer;
    font-weight:900;
    border-radius:6px;
    transition:transform 0.2s ease;
    text-decoration:none;
    display:inline-flex;
    align-items:center;
    gap:6px;
    box-shadow:0 0 10px rgba(37,211,102,0.5);
  }
  #waBtn:hover{transform:scale(1.1);}
  #waBtn svg{width:16px;height:16px;fill:#000;}
  #about{
    margin-top:50px;
    font-size:1.5rem;
    min-height:120px;
    white-space:pre-wrap;
    font-weight:900;
    letter-spacing:1px;
    max-width:600px;
    margin-left:auto;
    margin-right:auto;
  }

  /* ---- Desktop: wider layout, contact stays left-aligned within content column ---- */
  @media (min-width:768px){
    body{padding:80px 20px;}
    img{width:200px;height:200px;}
    h1{font-size:3.5rem;}
    #about{font-size:1.6rem;}
    .content{max-width:700px;margin:0 auto;}
    #contact{margin-left:0;}
  }

  /* ---- Mobile: tighter spacing, smaller type ---- */
  @media (max-width:480px){
    body{padding:40px 15px;}
    img{width:130px;height:130px;}
    h1{font-size:2rem;}
    #about{font-size:1.1rem;max-width:90%;}
    #contact{margin-left:10px;margin-bottom:60px;}
    #contact h2{font-size:0.8rem;}
    #waBtn{padding:7px 14px;font-size:0.75rem;}
    #waBtn svg{width:14px;height:14px;}
  }
</style>
</head>
<body>

<canvas id="stars"></canvas>

<div class="content">
  <img src="https://i.postimg.cc/nhxxB67n/IMG-0793.jpg" alt="RX Abdullah">
  <h1>rX Abdullah</h1>

  <div id="about"></div>

  <div style="height:20vh;"></div>

  <div id="contact">
    <h2>Contact Us</h2>
    <a id="waBtn" href="https://wa.me/message/ZK73V6OFSA2IA1" target="_blank">
      <svg viewBox="0 0 24 24"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.29-1.39c1.44.79 3.07 1.2 4.72 1.2h.01c5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.91-7.02A9.86 9.86 0 0012.04 2zm5.86 14.13c-.25.7-1.45 1.34-2 1.42-.51.08-1.16.11-1.87-.12-.43-.14-.99-.32-1.7-.63-3-1.3-4.96-4.32-5.11-4.52-.15-.2-1.22-1.62-1.22-3.09s.77-2.19 1.04-2.49c.27-.3.6-.37.8-.37s.4 0 .58.01c.19.01.44-.07.68.52.25.6.86 2.08.94 2.23.08.15.13.33.03.53-.1.2-.15.33-.3.5-.15.18-.31.4-.45.54-.15.15-.3.31-.13.6.17.3.77 1.27 1.65 2.05 1.14 1.02 2.1 1.34 2.4 1.49.3.15.47.13.65-.08.18-.2.75-.88.95-1.18.2-.3.4-.25.68-.15.28.1 1.78.84 2.08 1 .3.15.5.23.58.35.08.13.08.75-.17 1.45z"/></svg>
      WhatsApp
    </a>
  </div>
</div>

<script>
// ---- Typing bio ----
(()=>{
  let _txt="Hey, I'm RX! Just a regular person who loves coding, exploring new tech, and hanging out with friends. Always up for learning something new. Thanks for stopping by!";
  let _i=0;
  let _spd=60;
  let _el=document.getElementById('about');
  function _type(){
    if(_i<_txt.length){
      _el.textContent+=_txt.charAt(_i);
      _i++;
      setTimeout(_type,_spd);
    }
  }
  _type();
})();

// ---- Animated connecting stars, drifting upward ----
(()=>{
  const canvas=document.getElementById('stars');
  const ctx=canvas.getContext('2d');
  let w,h,stars=[];
  const NUM_STARS=90;
  const LINK_DIST=140;

  // color palette, tap anywhere to cycle
  const COLORS=[
    [0,255,0],     // green
    [0,240,255],   // cyan
    [255,0,180],   // pink
    [255,200,0],   // amber
    [150,0,255],   // purple
    [255,60,60]    // red
  ];
  let colorIndex=0;
  document.addEventListener('click',()=>{
    colorIndex=(colorIndex+1)%COLORS.length;
  });
  document.addEventListener('touchstart',()=>{
    colorIndex=(colorIndex+1)%COLORS.length;
  });

  function resize(){
    w=canvas.width=window.innerWidth;
    h=canvas.height=window.innerHeight;
  }
  window.addEventListener('resize',resize);
  resize();

  function makeStar(){
    return{
      x:Math.random()*w,
      y:Math.random()*h,
      r:Math.random()*1.5+0.5,
      vy:-(Math.random()*0.4+0.15),
      vx:(Math.random()-0.5)*0.15
    };
  }
  for(let i=0;i<NUM_STARS;i++) stars.push(makeStar());

  function step(){
    ctx.clearRect(0,0,w,h);
    const [cr,cg,cb]=COLORS[colorIndex];

    // move stars
    for(const s of stars){
      s.x+=s.vx;
      s.y+=s.vy;
      if(s.y< -10){ s.y=h+10; s.x=Math.random()*w; }
      if(s.x<-10) s.x=w+10;
      if(s.x>w+10) s.x=-10;
    }

    // draw connecting lines
    for(let i=0;i<stars.length;i++){
      for(let j=i+1;j<stars.length;j++){
        const dx=stars[i].x-stars[j].x;
        const dy=stars[i].y-stars[j].y;
        const dist=Math.sqrt(dx*dx+dy*dy);
        if(dist<LINK_DIST){
          const opacity=1-(dist/LINK_DIST);
          ctx.strokeStyle="rgba("+cr+","+cg+","+cb+","+(opacity*0.35)+")";
          ctx.lineWidth=1;
          ctx.beginPath();
          ctx.moveTo(stars[i].x,stars[i].y);
          ctx.lineTo(stars[j].x,stars[j].y);
          ctx.stroke();
        }
      }
    }

    // draw stars
    for(const s of stars){
      ctx.beginPath();
      ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      ctx.fillStyle="rgba("+cr+","+cg+","+cb+",0.9)";
      ctx.shadowColor="rgb("+cr+","+cg+","+cb+")";
      ctx.shadowBlur=6;
      ctx.fill();
      ctx.shadowBlur=0;
    }

    requestAnimationFrame(step);
  }
  step();
})();
// ---- Scroll reveal for contact section ----
(()=>{
  const contact=document.getElementById('contact');
  const observer=new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){
        contact.classList.add('visible');
      }
    });
  },{threshold:0.2});
  observer.observe(contact);
})();
</script>

</body>
</html>
