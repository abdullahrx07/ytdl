services:
  - type: web
    name: rx-youtube-download-api
    runtime: node
    plan: free
    buildCommand: corepack enable && corepack install --global pnpm@10.26.1 && pnpm install --frozen-lockfile && pnpm --filter @workspace/api-server run build
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production